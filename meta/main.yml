---
galaxy_info:
  role_name: ca
  namespace: sorrowless
  author: Stan Bogatkin
  description: >-
    Ansible role that bootstraps an OpenSSL certificate authority for TLS
    syslog (for example syslog-ng). Does not install or configure syslog-ng.
  company: Personal project
  license: Apache-2.0
  min_ansible_version: "2.16"

  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
        - resolute

  galaxy_tags:
    - openssl
    - ca
    - authority
    - certificates
    - tls
    - syslog

dependencies: []

collections:
  - community.crypto
