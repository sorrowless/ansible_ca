---
dependency:
  name: shell
  command: >
    ansible-galaxy collection install -r
    ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml
    --force-with-deps

driver:
  name: docker

platforms:
  - name: instance
    image: "ubuntu:${MOLECULE_DISTRO:-24.04}"
    dockerfile: Dockerfile.j2
    pre_build_image: false
    pull: false
    privileged: false
    override_command: true
    command: "sleep infinity"
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      strategy: linear
      stdout_callback: default
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_STRATEGY: linear
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        ca_privatekey_password: molecule-test-passphrase
        fetch_ca_cert: true
        local_ca_cert_dir: /tmp/molecule_ca_dir

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
