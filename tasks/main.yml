---
- name: Check prerequisites
  ansible.builtin.import_tasks: _prechecks.yml

- name: Install requirements
  ansible.builtin.import_tasks: install_requirements.yml

- name: Configure CA
  ansible.builtin.import_tasks: configure_ca.yml

- name: Setup CA
  ansible.builtin.import_tasks: generate_ca.yml

- name: Fetch CA certificate
  ansible.builtin.import_tasks: fetch_ca_cert.yml
  when: fetch_ca_cert | bool
