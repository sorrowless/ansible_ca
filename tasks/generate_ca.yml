---
- name: Create CA private key
  community.crypto.openssl_privatekey:
    path: "{{ ca_key }}"
    size: "{{ ca_key_size }}"
    type: RSA
    passphrase: "{{ ca_privatekey_password }}"
    mode: "0600"
    owner: root
    group: root
    backup: true
  no_log: true

- name: Create CA certificate signing request
  community.crypto.openssl_csr:
    path: "{{ csr_dir }}/ca.csr"
    privatekey_path: "{{ ca_key }}"
    privatekey_passphrase: "{{ ca_privatekey_password }}"
    common_name: "{{ ca.common_name }}"
    country_name: "{{ ca.country }}"
    state_or_province_name: "{{ ca.province }}"
    locality_name: "{{ ca.city }}"
    organization_name: "{{ ca.org }}"
    organizational_unit_name: "{{ ca.ou }}"
    email_address: "{{ ca.email }}"
    basic_constraints:
      - CA:TRUE
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
    mode: "0644"
    owner: root
    group: root
  no_log: true

- name: Sign CA certificate
  community.crypto.x509_certificate:
    path: "{{ ca_cert }}"
    provider: selfsigned
    selfsigned_digest: sha256
    selfsigned_not_after: "+{{ ca_days }}d"
    privatekey_path: "{{ ca_key }}"
    privatekey_passphrase: "{{ ca_privatekey_password }}"
    csr_path: "{{ csr_dir }}/ca.csr"
    mode: "0644"
    owner: root
    group: root
    backup: true
  no_log: true

- name: Register CA certificate hash
  ansible.builtin.command:
    cmd: openssl x509 -noout -hash -in {{ ca_cert }}
  register: ca_cert_hash
  changed_when: false

- name: Create CA certificate hash link
  ansible.builtin.file:
    src: "{{ ca_cert }}"
    dest: "{{ certs_dir }}/{{ ca_cert_hash.stdout }}.0"
    state: link
    force: true

- name: Create CRL
  ansible.builtin.command:
    cmd: >-
      openssl ca
      -config {{ ca_openssl_config }}
      -passin env:CA_PASS
      -gencrl
      -out {{ crl_dir }}/crl.pem
    creates: "{{ crl_dir }}/crl.pem"
  environment:
    CA_PASS: "{{ ca_privatekey_password }}"
  no_log: true

- name: Create CRL hash link
  ansible.builtin.file:
    src: "{{ crl_dir }}/crl.pem"
    dest: "{{ crl_dir }}/{{ ca_cert_hash.stdout }}.r0"
    state: link
    force: true
